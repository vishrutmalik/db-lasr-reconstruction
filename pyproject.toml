[tool.ruff.lint.per-file-ignores]
# The determinism ban targets src/lasr/ (proposal §4); test fixtures manage
# their own seeded Generators via tests/conftest.py.
"tests/**" = ["TID251"]

# ── mypy: strict on src/lasr, relaxed on tests (proposal §4) ─────────────────

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src/lasr"]
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

# ── pytest: tiers via markers (testing_strategy.md §1, §6) ───────────────────

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
markers = [
    "unit: pure-function/schema/property tests; no I/O beyond tmp dirs",
    "integration: cross-module tests (provider contract, ingestion->canonical->PIT)",
    "e2e: CLI vertical slice on small synthetic data",
    "leakage: LT-### scenario battery, generator-driven",
    "regression: pinned paper golden values and frozen artifact hashes",
    "slow: moved out of the PR gate into nightly (testing_strategy.md §6)",
]
