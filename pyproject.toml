#
# G016 — toolchain per docs/architecture/toolchain_proposal.md.
# Runtime dependency additions require a decisions.md entry (proposal §4).
#

[project]
name = "lasr"
version = "0.1.0"
description = "DB LASR reconstruction: point-in-time data layers, LASR/NLASR learners, walk-forward validation, portfolio construction, backtesting."
readme = "README.md"
requires-python = ">=3.11,<3.13"
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
# Runtime set per toolchain_proposal.md §4 — keep it this small.
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2",
    "pyarrow>=16",
    "pydantic>=2.7",
    "PyYAML>=6",
    "scipy>=1.13",
]

[project.optional-dependencies]
# Challenger-only extra (proposal §4): installed by G036, never imported by
# `src/lasr` core (import-rule test enforces this from G017).
challengers = [
    "scikit-learn>=1.5",
    "xgboost>=2.1",
]

[project.scripts]
# Entry point wiring per proposal §6; `lasr.cli.main` is implemented at G029.
lasr = "lasr.cli:main"

[dependency-groups]
# Dev tools per toolchain_proposal.md §4.
# pandas-stubs + types-PyYAML added under the G043 one-goal pyproject grant
# (G017 final-report recommendation; typed-boundary rule under mypy strict).
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lasr"]

# ── ruff: one tool for format + lint (proposal §4) ───────────────────────────

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "TID", # flake8-tidy-imports (carries the banned-api determinism rule)
]

# Determinism rule (training_and_artifacts.md §6.1): single RNG root
# `np.random.Generator(PCG64(seed))`, children via `rng.spawn()`. The stdlib
# `random` module and legacy global-state `np.random.*` calls are banned in
# `src/lasr/`.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"random".msg = "Use np.random.Generator(PCG64(seed)) spawned from the experiment seed (training_and_artifacts.md §6.1)."
"numpy.random.seed".msg = "Global RNG state is banned; use a spawned Generator (training_and_artifacts.md §6.1)."
"numpy.random.RandomState".msg = "Legacy RandomState is banned; use np.random.Generator(PCG64(seed)) (training_and_artifacts.md §6.1)."
"numpy.random.rand".msg = "Bare np.random.* is banned; use a spawned Generator (training_and_artifacts.md §6.1)."
"numpy.random.randn".msg = "Bare np.random.* is banned; use a spawned Generator (training_and_artifacts.md §6.1)."
"numpy.random.randint".msg = "Bare np.random.* is banned; use a spawned Generator (training_and_artifacts.md §6.1)."
"numpy.random.random".msg = "Bare np.random.* is banned; use a spawned Generator (training_and_artifacts.md §6.1)."
"numpy.random.random_sample".msg = "Bare np.random.* is banned; use a spawned Generator (training_and_artifacts.md §6.1)."
"numpy.random.choice".msg = "Bare np.random.* is banned; use a spawned Generator (training_and_artifacts.md §6.1)."
"numpy.random.shuffle".msg = "Bare np.random.* is banned; use a spawned Generator (training_and_artifacts.md §6.1)."
"numpy.random.permutation".msg = "Bare np.random.* is banned; use a spawned Generator (training_and_artifacts.md §6.1)."
"numpy.random.normal".msg = "Bare np.random.* is banned; use a spawned Generator (training_and_artifacts.md §6.1)."
"numpy.random.uniform".msg = "Bare np.random.* is banned; use a spawned Generator (training_and_artifacts.md §6.1)."
"numpy.random.standard_normal".msg = "Bare np.random.* is banned; use a spawned Generator (training_and_artifacts.md §6.1)."
